<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Memory Watcher Options</title>
    <link rel="stylesheet" href="options.css" />
</head>
<body>
    <div class="container">
        <h1>Memory Watcher</h1>

        <div class="card">
            <label class="field-label">Memory limit (MB)</label>
            <input id="limit" type="number" min="1" step="1" class="input" />
        </div>

        <div class="card">
            <label class="field-label">Toast position</label>
            <select id="position" class="select">
                <option value="bottom-right">Bottom Right</option>
                <option value="bottom-left">Bottom Left</option>
                <option value="top-right">Top Right</option>
                <option value="top-left">Top Left</option>
            </select>
        </div>

        <div class="button-row">
            <button id="save" class="btn primary">Save Settings</button>
            <button id="preview" class="btn warning">Test Preview</button>
        </div>

        <p>Developed by <a href="https://yagasaki.vercel.app/" target="_blank">Yagasaki7K</a></p>
    </div>

    <script src="options.js"></script>
</body>
</html>
